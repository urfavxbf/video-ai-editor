<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>UrFavXBF — HyperFrames Kinetic Motion Intro</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:1920px;height:1080px;background:#07111a;overflow:hidden}
    #root{position:relative;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(ellipse at 75% 40%,#114c57 0%,#07111a 66%);color:#e5fff8;font-family:Arial,Helvetica,sans-serif}
    .clip{position:absolute;inset:0}
    .rail{position:absolute;left:160px;top:180px;height:8px;width:245px;background:#72f5ba;transform-origin:left center}
    .eyebrow{position:absolute;left:160px;top:280px;font-size:41px;letter-spacing:11px;font-weight:800;color:#8bedc9}
    #headline{position:absolute;left:152px;top:370px;font-size:140px;letter-spacing:-8px;font-weight:900;line-height:.96;max-width:1550px}
    #accent{color:#72f5ba;display:inline-block}
    #tag{position:absolute;left:160px;bottom:162px;font-size:33px;letter-spacing:4px;color:#c1e7df}
    .orb{position:absolute;right:158px;top:104px;width:520px;height:520px;border:4px solid #77f6bf;border-radius:50%;opacity:.8}
    .orb-inner{position:absolute;right:245px;top:192px;width:345px;height:345px;border-radius:50%;background:#1fa88066;box-shadow:0 0 115px #47ef9b55}
    .underline{position:absolute;bottom:110px;left:160px;right:160px;height:3px;background:#72f5ba}
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0"
       data-width="1920" data-height="1080" data-fps="30" data-duration="2">
    <section class="clip" id="scene-1" data-start="0" data-duration="2" data-track-index="1">
      <div class="orb" id="orb"></div><div class="orb-inner" id="core"></div>
      <div class="rail" id="rail"></div>
      <div class="eyebrow" id="eyebrow">MOTION SYSTEM // 01</div>
      <div id="headline"><div id="headline-top">IDEAS INTO</div><span id="accent">MOTION.</span></div>
      <div id="tag">ORIGINAL GRAPHICS • FRAME-ACCURATE • LOCAL RENDER</div>
      <div class="underline"></div>
    </section>
  </div>
  <script src="./assets/gsap.min.js"></script>
  <script>
    // GSAP is copied from the pinned npm dependency; seekable animation, no external script.
    const timeline = gsap.timeline({paused:true});
    timeline.from("#headline-top",{y:100,opacity:0,duration:.55,ease:"power3.out"},0.05)
      .from("#accent",{y:70,opacity:0,duration:.6,ease:"power3.out"},0.23)
      .from("#eyebrow",{x:-80,opacity:0,duration:.4,ease:"power2.out"},0)
      .from("#rail",{scaleX:0,duration:.5,ease:"power2.out"},0)
      .from("#tag",{y:30,opacity:0,duration:.55,ease:"power2.out"},0.48)
      .from("#orb",{scale:.65,opacity:0,rotation:-45,duration:.85,ease:"power2.out"},0.1)
      .from("#core",{scale:.8,opacity:0,duration:.7,ease:"power2.out"},0.25)
      .to("#orb",{rotation:25,duration:.95,ease:"none"},1.0)
      .to("#accent",{scale:1.035,duration:.4,ease:"power2.inOut"},1.2);
    window.__timelines["main"] = timeline;
  </script>
</body>
</html>
