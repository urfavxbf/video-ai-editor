  <path d="M0 1010 Q400 805 720 895T1420 765T1920 675" fill="none" stroke="#55ecca" stroke-opacity=".18" stroke-width="2"/>
  <circle cx="1475" cy="372" r="275" fill="none" stroke="#85ffe0" stroke-opacity=".25" stroke-width="3"/>
  <circle cx="1475" cy="372" r="210" fill="none" stroke="#85ffe0" stroke-opacity=".17" stroke-width="2"/>
</svg>
