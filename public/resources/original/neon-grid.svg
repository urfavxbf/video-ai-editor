<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <title>Original UrFavXBF Neon Grid Background</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050915"/><stop offset="1" stop-color="#05252b"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#42ffb2" stop-opacity=".58"/><stop offset="1" stop-color="#42ffb2" stop-opacity="0"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#16dfba" stop-opacity=".17"/><stop offset="1" stop-color="#16dfba" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="96" height="96" patternUnits="userSpaceOnUse"><path d="M96 0H0V96" fill="none" stroke="#6ee7a8" stroke-opacity=".12" stroke-width="2"/></pattern>
