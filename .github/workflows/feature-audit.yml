name: Full feature audit — isolated nonproduction smoke

on:
  push:
    branches:
      - audit/full-feature-smoke-20261031
    paths:
      - .github/workflows/feature-audit.yml
      - audits/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Core typecheck, contracts, assets, security and episode tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install tested local dependencies (no external generation APIs)
        run: |
          npm ci --no-audit --no-fund
          python -m pip install -r requirements.txt
          if ! command -v ffprobe >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
      - name: Typecheck every registered composition
        run: npm run typecheck
      - name: Run all JS edit, timeline, caption and metadata contracts
        run: node --test tests/*.test.cjs
      - name: Run entire Python unit and regression test suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run isolated OpenMontage integration tests
        run: python -m unittest discover -s integrations/openmontage/tests -p 'test_*.py' -v
      - name: Verify approved assets and recorded composition durations
        run: |
          python scripts/stage_pixel_default_pack.py --verify-workspace
          node scripts/check-composition-metadata.mjs

  fx-render:
    name: Every one of 21 FX renders a genuine standalone still
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Remotion + fixture image tools
        run: |
          npm ci --no-audit --no-fund
          python -m pip install Pillow==11.3.0
          npx remotion browser ensure
          if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
      - name: Create original local test source with 300 transparent masks
        run: |
          mkdir -p public/sample/fg public/sample/sticker out/audit-fx
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'testsrc2=size=540x960:rate=30' \
            -t 12 -c:v libx264 -preset ultrafast -pix_fmt yuv420p public/sample/take.mp4
          python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          for n in range(300):
              image=Image.new('RGBA',(216,384),(0,0,0,0))
              dr=ImageDraw.Draw(image)
              x=96+n%40
              dr.ellipse((x-42,50,x+42,135),fill=(236,186,161,255))
              dr.rounded_rectangle((x-62,135,x+62,336),radius=18,fill=(30,130,184,255))
              image.save(Path('public/sample/fg')/f'{n:04}.webp',lossless=True)
              image.save(Path('public/sample/sticker')/f'{n:04}.webp',lossless=True)
          PY
      - name: Render each actual effect in isolation
        shell: bash
        run: |
          set -euo pipefail
          effects=(
            orbit chat-takeover frame-escape snap-zoom checklist-pop headline-storm
            zoom-portal growth-curve broll-overlay paper-cutout magazine-cover
            liquid-glass zoom-through-cut green-screen frame-break digital-zoom
            phone-mockup checklist-tally glass-widgets checklist split
          )
          for id in "${effects[@]}"; do
            echo "::group::Render $id"
            npx remotion still FxPreview "out/audit-fx/$id.png" \
              --frame=20 --scale=0.25 --props="{\"id\":\"$id\",\"from\":0}"
            test -s "out/audit-fx/$id.png"
            echo "::endgroup::"
          done
          test "$(find out/audit-fx -maxdepth 1 -name '*.png' | wc -l)" -eq 21
          echo "PASS: all 21 registered effects returned nonempty PNG stills"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feature-audit-effects
          path: out/audit-fx/*.png
          if-no-files-found: warn
          retention-days: 3

  compositions:
    name: Video compositions, characters, edit source and native features
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and provision a disposable test clip
        run: |
          npm ci --no-audit --no-fund
          npx remotion browser ensure
          if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          mkdir -p public/sample out/audit-compositions
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'testsrc2=size=540x960:rate=30' \
            -f lavfi -i 'sine=frequency=240:sample_rate=48000' \
            -t 12 -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -c:a aac public/sample/take.mp4
      - name: Verify key actual compositions render
        shell: bash
        run: |
          set -euo pipefail
          for id in HeroCharacterStage PixelProductionProof CharacterAnimationLab \
            EpisodeTimelineProof EpisodeProduction OfficialFeaturesDemo RepoShowcase \
            V4FacialReviewStage CanonicalFullBodyReviewStage \
            TrueFrameReviewStage ChibiV4ReviewStage Y2038Teaser; do
            echo "::group::$id"
            npx remotion still "$id" "out/audit-compositions/$id.png" --frame=12 --scale=0.25
            test -s "out/audit-compositions/$id.png"
            echo "::endgroup::"
          done
          for id in DudutPremium DudutV2; do
            npx remotion still "$id" "out/audit-compositions/$id.png" --frame=12 --scale=0.25 \
              --props='{"videoPath":"sample/take.mp4","sourceStartSeconds":0}'
            test -s "out/audit-compositions/$id.png"
          done
          echo "PASS: 14 key composition stills returned nonempty files"
      - name: Encode real video with both H264 and AAC
        run: |
          npx remotion render RepoShowcase out/audit-compositions/repo-showcase-video.mp4 \
            --frames=0-29 --scale=0.25 --concurrency=2 --codec=h264 \
            --pixel-format=yuv420p
          python - <<'PY'
          import json, subprocess
          cmd=['ffprobe','-v','error','-show_entries','stream=codec_name,width,height,nb_frames',
               '-of','json','out/audit-compositions/repo-showcase-video.mp4']
          streams=json.loads(subprocess.check_output(cmd,text=True))['streams']
          videos=[s for s in streams if s['codec_name']=='h264']
          assert len(videos)==1 and videos[0]['width']==270 and videos[0]['height']==480
          assert videos[0]['nb_frames']=='30'
          print('Verified true H264 30-frame output: 270x480')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feature-audit-compositions
          path: out/audit-compositions/*
          if-no-files-found: warn
          retention-days: 3
