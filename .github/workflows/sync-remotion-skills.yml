name: Import official Remotion Agent Skills
on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-remotion-skills.sh'
      - '.github/workflows/sync-remotion-skills.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Video AI Editor
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import pinned official Remotion skills
        run: bash scripts/sync-remotion-skills.sh
      - name: Verify the 12 official skills and preserve original project skill
        shell: bash
        run: |
          set -euo pipefail
          test -s .claude/skills/ai-video-editor/SKILL.md
          for skill in remotion-best-practices remotion-captions remotion-create remotion-docs remotion-interactivity remotion-maps remotion-markup remotion-multimedia remotion-render remotion-saas remotion-studio remotion-upgrade; do
            test -s ".claude/skills/$skill/SKILL.md"
          done
          test "$(find .claude/skills -mindepth 2 -maxdepth 2 -path '*/remotion-*/SKILL.md' | wc -l)" -eq 12
          test "$(cat docs/REMOTION_SKILLS_SOURCE_COMMIT.txt)" = "30d4553ecd46fbc5212fd0ff006ae43af522158b"
          echo "12 official skills verified; existing ai-video-editor skill intact."
      - name: Commit official skills into main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude/skills/remotion-* docs/REMOTION_SKILLS_SOURCE_COMMIT.txt
          if git diff --cached --quiet; then
            echo "Official skills were already current; nothing to commit."
            exit 0
          fi
          git commit -m "Vendor 12 official Remotion agent skills at pinned upstream commit"
          git push origin HEAD:main
