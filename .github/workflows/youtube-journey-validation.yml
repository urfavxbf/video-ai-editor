name: YouTube beginner journey — validation

on:
  push:
    branches: [episode/youtube-beginner-journey]
    paths:
      - 'src/episodes/YouTubeJourneyPreview.tsx'
      - 'src/episodes/YouTubeJourneyVisuals.tsx'
      - 'src/episodes/YouTubeJourneyFullEpisode.tsx'
      - 'src/episodes/YouTubeJourneyFullBodyCharacters.tsx'
      - 'src/episodes/YouTubeJourneyStyleframes.tsx'
      - 'src/characters/CharacterPuppet.tsx'
      - 'src/Root.tsx'
      - 'scripts/build_youtube_journey_preview.py'
      - 'scripts/build_youtube_journey_full.py'
      - 'scripts/validate_youtube_journey_fullbody.py'
      - 'scripts/render_youtube_journey_voices.py'
      - 'tests/test_youtube_journey_preview.py'
      - 'tests/test_youtube_journey_full.py'
      - 'tests/test_youtube_journey_fullbody.py'
      - 'productions/youtube-beginner-journey/**'
      - '.github/workflows/youtube-journey-validation.yml'
  pull_request:
    paths:
      - 'src/episodes/YouTubeJourneyPreview.tsx'
      - 'src/episodes/YouTubeJourneyVisuals.tsx'
      - 'src/episodes/YouTubeJourneyFullEpisode.tsx'
      - 'src/episodes/YouTubeJourneyFullBodyCharacters.tsx'
      - 'src/episodes/YouTubeJourneyStyleframes.tsx'
      - 'src/characters/CharacterPuppet.tsx'
      - 'src/Root.tsx'
      - 'scripts/build_youtube_journey_preview.py'
      - 'scripts/build_youtube_journey_full.py'
      - 'scripts/validate_youtube_journey_fullbody.py'
      - 'scripts/render_youtube_journey_voices.py'
      - 'tests/test_youtube_journey_preview.py'
      - 'tests/test_youtube_journey_full.py'
      - 'tests/test_youtube_journey_fullbody.py'
      - 'productions/youtube-beginner-journey/**'
      - '.github/workflows/youtube-journey-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youtube-journey-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test real-WAV timeline and creative contract (no model download)
        run: |
          python -m unittest discover -s tests -p 'test_youtube_journey_*.py' -v
          python -m py_compile scripts/build_youtube_journey_preview.py scripts/build_youtube_journey_full.py scripts/render_youtube_journey_voices.py scripts/validate_youtube_journey_fullbody.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked Remotion dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck existing and new compositions
        run: npm run typecheck
      - name: Render all eight assetless visual-design reference frames
        run: |
          mkdir -p out/youtube-journey-visuals
          for second in 20 85 180 265 375 475 560 645; do
            npx remotion still YouTubeJourneyVisualBoard \
              "out/youtube-journey-visuals/beat-${second}.png" \
              --frame=$((second*30)) --scale=0.5
            test -s "out/youtube-journey-visuals/beat-${second}.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: youtube-journey-eight-original-visual-beats
          path: out/youtube-journey-visuals/*.png
          retention-days: 14
          if-no-files-found: error
