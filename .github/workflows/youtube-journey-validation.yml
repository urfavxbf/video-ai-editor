name: YouTube beginner journey — validation

on:
  push:
    branches: [episode/youtube-beginner-journey]
    paths:
      - 'src/episodes/YouTubeJourneyPreview.tsx'
      - 'src/episodes/YouTubeJourneyVisuals.tsx'
      - 'src/episodes/YouTubeJourneyFullEpisode.tsx'
      - 'src/episodes/YouTubeJourneyFullBodyCharacters.tsx'
      - 'src/episodes/YouTubeJourneyStyleframes.tsx'
      - 'src/characters/CharacterPuppet.tsx'
      - 'src/characters/HeroPerformance.ts'
      - 'src/characters/HeroCharacterStage.tsx'
      - 'src/characters/OfficialV2Rig.ts'
      - 'src/characters/FullAnimationLibrary.tsx'
      - 'src/characters/HeroAnimationReviewReel.tsx'
      - 'src/characters/HeroAnimationTimeline.tsx'
      - 'src/characters/ChibiV4Sprite.tsx'
      - 'src/characters/ChibiV4ReviewStage.tsx'
      - 'characters/chibi-v4-design.json'
      - 'tests/test_chibi_v4_design.py'
      - 'characters/full-animation-set.json'
      - 'characters/registry.json'
      - 'src/Root.tsx'
      - 'scripts/build_youtube_journey_preview.py'
      - 'scripts/build_youtube_journey_full.py'
      - 'scripts/validate_youtube_journey_fullbody.py'
      - 'scripts/prepare_hero_stage.py'
      - 'scripts/rig_official_v2_characters.py'
      - 'scripts/validate_full_animation_set.py'
      - 'scripts/validate_chibi_v4_assets.py'
      - 'scripts/render_youtube_journey_voices.py'
      - 'tests/test_youtube_journey_preview.py'
      - 'tests/test_youtube_journey_full.py'
      - 'tests/test_youtube_journey_fullbody.py'
      - 'tests/test_youtube_journey_hero.py'
      - 'tests/test_youtube_journey_rig.py'
      - 'tests/test_full_animation_catalog.py'
      - 'requirements-character-rig.txt'
      - 'productions/youtube-beginner-journey/**'
      - '.github/workflows/youtube-journey-validation.yml'
  pull_request:
    paths:
      - 'src/episodes/YouTubeJourneyPreview.tsx'
      - 'src/episodes/YouTubeJourneyVisuals.tsx'
      - 'src/episodes/YouTubeJourneyFullEpisode.tsx'
      - 'src/episodes/YouTubeJourneyFullBodyCharacters.tsx'
      - 'src/episodes/YouTubeJourneyStyleframes.tsx'
      - 'src/characters/CharacterPuppet.tsx'
      - 'src/characters/HeroPerformance.ts'
      - 'src/characters/HeroCharacterStage.tsx'
      - 'src/characters/OfficialV2Rig.ts'
      - 'src/characters/FullAnimationLibrary.tsx'
      - 'src/characters/HeroAnimationReviewReel.tsx'
      - 'src/characters/HeroAnimationTimeline.tsx'
      - 'src/characters/ChibiV4Sprite.tsx'
      - 'src/characters/ChibiV4ReviewStage.tsx'
      - 'characters/chibi-v4-design.json'
      - 'tests/test_chibi_v4_design.py'
      - 'characters/full-animation-set.json'
      - 'characters/registry.json'
      - 'src/Root.tsx'
      - 'scripts/build_youtube_journey_preview.py'
      - 'scripts/build_youtube_journey_full.py'
      - 'scripts/validate_youtube_journey_fullbody.py'
      - 'scripts/prepare_hero_stage.py'
      - 'scripts/rig_official_v2_characters.py'
      - 'scripts/validate_full_animation_set.py'
      - 'scripts/validate_chibi_v4_assets.py'
      - 'scripts/render_youtube_journey_voices.py'
      - 'tests/test_youtube_journey_preview.py'
      - 'tests/test_youtube_journey_full.py'
      - 'tests/test_youtube_journey_fullbody.py'
      - 'tests/test_youtube_journey_hero.py'
      - 'tests/test_youtube_journey_rig.py'
      - 'tests/test_full_animation_catalog.py'
      - 'requirements-character-rig.txt'
      - 'productions/youtube-beginner-journey/**'
      - '.github/workflows/youtube-journey-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youtube-journey-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic pixel-art rig image dependencies
        run: python -m pip install -r requirements-character-rig.txt
      - name: Test real-WAV timeline and creative contract (no model download)
        run: |
          python -m unittest discover -s tests -p 'test_youtube_journey_*.py' -v
          python -m unittest discover -s tests -p 'test_full_animation_catalog.py' -v
          python scripts/validate_full_animation_set.py
          python -m unittest discover -s tests -p 'test_chibi_v4_design.py' -v
          python -m py_compile scripts/validate_chibi_v4_assets.py
          python -m py_compile scripts/build_youtube_journey_preview.py scripts/build_youtube_journey_full.py scripts/render_youtube_journey_voices.py scripts/validate_youtube_journey_fullbody.py scripts/prepare_hero_stage.py scripts/rig_official_v2_characters.py scripts/validate_full_animation_set.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked Remotion dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck existing and new compositions
        run: npm run typecheck
      - name: Render all eight assetless visual-design reference frames
        run: |
          mkdir -p out/youtube-journey-visuals
          for second in 20 85 180 265 375 475 560 645; do
            npx remotion still YouTubeJourneyVisualBoard \
              "out/youtube-journey-visuals/beat-${second}.png" \
              --frame=$((second*30)) --scale=0.5
            test -s "out/youtube-journey-visuals/beat-${second}.png"
          done
      - name: Render independent character-focused stage frame (no private assets)
        run: |
          npx remotion still HeroCharacterStage out/hero-character-stage-reference.png \
            --frame=90 --scale=0.5
          test -s out/hero-character-stage-reference.png
      - name: Render source-honest 48-frame close-up sprite review placeholder
        run: |
          npx remotion still HeroAnimationReviewReel out/hero-animation-review-staging.png --frame=20 --scale=0.5
          test -s out/hero-animation-review-staging.png
      - name: Render new dark-green Chibi V4 asset-staging preview
        run: |
          npx remotion still ChibiV4ReviewStage out/chibi-v4-staging-reference.png --frame=40 --scale=0.5
          test -s out/chibi-v4-staging-reference.png
      - uses: actions/upload-artifact@v4
        with:
          name: youtube-journey-eight-original-visual-beats
          path: out/youtube-journey-visuals/*.png
          retention-days: 14
          if-no-files-found: error
