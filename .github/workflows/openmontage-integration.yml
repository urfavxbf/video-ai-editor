name: OpenMontage isolated integration

on:
  pull_request:
    paths:
      - "integrations/openmontage/**"
      - ".devcontainer/openmontage/**"
      - ".github/workflows/openmontage-integration.yml"

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate integration contracts and Bash syntax
        run: python -m unittest discover -s integrations/openmontage/tests -p 'test_*.py' -v

  zero-key-render-smoke:
    needs: contract-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install FFmpeg if missing
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Install pinned isolated upstream (without optional TTS)
        run: bash integrations/openmontage/scripts/setup.sh --skip-tts
      - name: Verify environment without exposing secrets
        run: bash integrations/openmontage/scripts/doctor.sh
      - name: Render and probe a free demo MP4
        run: bash integrations/openmontage/scripts/demo.sh world-in-numbers
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: openmontage-world-in-numbers-smoke
          path: integrations/openmontage/.runtime/openmontage/projects/demos/renders/world-in-numbers.mp4
          if-no-files-found: error
          retention-days: 3
