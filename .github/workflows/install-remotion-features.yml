name: Install official Remotion editing features
on:
  push:
    branches: [main]
    paths:
      - 'scripts/install-remotion-features.sh'
      - '.github/workflows/install-remotion-features.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install-feature-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and validate Remotion official feature modules
        run: bash scripts/install-remotion-features.sh
      - name: Persist exact package versions and lock file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Feature modules already installed."
          else
            git commit -m "Install official Remotion captions, transitions, effects, shapes, SFX, player and motion blur"
            git push origin HEAD:main
          fi
