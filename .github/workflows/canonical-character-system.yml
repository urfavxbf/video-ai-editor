name: Canonical chibi characters — global validation

on:
  pull_request:
    paths:
      - 'characters/**'
      - 'scripts/stage_pixel_default_pack.py'
      - 'tests/test_pixel_default_contract.py'
      - 'src/characters/**'
      - 'src/Root.tsx'
      - 'scripts/import_sprite_animation.py'
      - 'scripts/stage_canonical_fullbody_pack.py'
      - 'scripts/true_frame_action_pipeline.py'
      - 'scripts/extract_drawn_pose_grid.py'
      - 'scripts/validate_chibi_v4_*.py'
      - 'scripts/validate_v4_facial_assets.py'
      - 'tests/test_character_registry.py'
      - 'tests/test_chibi_v4_*.py'
      - 'tests/test_import_sprite_animation.py'
      - 'tests/test_stage_canonical_fullbody_pack.py'
      - 'tests/test_true_frame_action_pipeline.py'
      - 'tests/test_extract_drawn_pose_grid.py'
      - 'tests/test_v4_facial_system.py'
      - '.github/workflows/canonical-character-system.yml'
  push:
    branches: [main]
    paths:
      - 'characters/**'
      - 'src/characters/**'
      - 'src/Root.tsx'
      - 'scripts/import_sprite_animation.py'
      - 'scripts/validate_chibi_v4_*.py'
      - 'scripts/validate_v4_facial_assets.py'
      - 'tests/test_character_registry.py'
      - 'tests/test_chibi_v4_*.py'
      - 'tests/test_import_sprite_animation.py'
      - 'tests/test_v4_facial_system.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  character-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only sprite validation dependencies
        run: python -m pip install Pillow==11.3.0
      - name: Validate canonical registry, chibi sources, facial contract and sprite imports
        run: |
          python -m unittest discover -s tests -p 'test_character_registry.py' -v
          python -m unittest discover -s tests -p 'test_pixel_default_contract.py' -v
          python -m unittest discover -s tests -p 'test_chibi_v4_*.py' -v
          python -m unittest discover -s tests -p 'test_v4_facial_system.py' -v
          python -m unittest discover -s tests -p 'test_import_sprite_animation.py' -v
          python -m unittest discover -s tests -p 'test_stage_canonical_fullbody_pack.py' -v
          python -m unittest discover -s tests -p 'test_true_frame_action_pipeline.py' -v
          python -m unittest discover -s tests -p 'test_extract_drawn_pose_grid.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Typecheck reusable Remotion character system
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
      - name: Render asset-pending workbenches without legacy fallbacks
        run: |
          npx remotion still HeroCharacterStage out/canonical-hero-stage.png --frame=80 --scale=0.5
          npx remotion still V4FacialReviewStage out/canonical-facial-stage.png --frame=80 --scale=0.5
          npx remotion still ChibiV4ReviewStage out/canonical-sprite-stage.png --frame=80 --scale=0.5
          npx remotion still CanonicalFullBodyReviewStage out/canonical-fullbody-stage.png --frame=80 --scale=0.5
          npx remotion still TrueFrameReviewStage out/canonical-true-frame-stage.png --frame=80 --scale=0.5
          test -s out/canonical-hero-stage.png
          test -s out/canonical-facial-stage.png
          test -s out/canonical-sprite-stage.png
          test -s out/canonical-fullbody-stage.png
          test -s out/canonical-true-frame-stage.png
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-character-assetless-smoke
          path: out/canonical-*.png
          retention-days: 7
