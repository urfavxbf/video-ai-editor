name: Render Premium Podcast Short

on:
  push:
    branches:
      - main
    paths:
      - 'render-queue/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out editing repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install FFmpeg and Remotion
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          npm ci --no-audit --no-fund
          npx remotion browser ensure
      - name: Retrieve Dudut source clip
        run: python3 scripts/prepare-render-source.py render-queue/dudut-20261027-premium.json
      - name: Render Dudut Premium
        run: bash scripts/render-dudut.sh input/50812.mp4
      - name: Confirm MP4 properties
        run: |
          test -s out/dudut-premium-1080x1920.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 out/dudut-premium-1080x1920.mp4
      - name: Provide downloadable MP4
        uses: actions/upload-artifact@v4
        with:
          name: dudut-premium-1080p
          path: out/dudut-premium-1080x1920.mp4
          retention-days: 14
          if-no-files-found: error
