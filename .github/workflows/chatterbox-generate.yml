name: Generate Chatterbox V3 narration

on:
  workflow_dispatch:
    inputs:
      narration:
        description: 'English narration using approved Natural Storyteller default (long scripts split automatically)'
        required: true
        type: string
        default: 'Imagine looking up tonight and discovering the Moon is gone. What changes on Earth?'
      pause_ms:
        description: 'Pause between narration chunks in milliseconds'
        required: true
        type: choice
        default: '280'
        options:
          - '180'
          - '280'
          - '400'

permissions:
  contents: read

jobs:
  synthesize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONUNBUFFERED: '1'
      NARRATION_TEXT: ${{ inputs.narration }}
      PAUSE_MS: ${{ inputs.pause_ms }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-chatterbox.txt
      - name: Validate and save input script safely
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from sys import exit
          text = os.environ.get('NARRATION_TEXT', '').strip()
          if not text or len(text) > 16000:
              exit('Narration text must contain 1 to 16,000 characters')
          Path('input').mkdir(exist_ok=True)
          Path('input/narration.txt').write_text(text, encoding='utf-8')
          print('Accepted narration length:', len(text))
          PY
      - name: Install CPU PyTorch and upstream pinned Chatterbox V3
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.6.0 torchaudio==2.6.0
          python -m pip install -r requirements-chatterbox.txt
          python scripts/check_chatterbox_v3.py
      - name: Generate English narration (approved Natural Storyteller voice)
        run: |
          python scripts/chatterbox_longform.py \
            --text-file input/narration.txt \
            --language-id en \
            --device cpu \
            --pause-ms "$PAUSE_MS" \
            --output out/chatterbox-v3-narration.wav
      - name: Validate recorded narration
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import wave
          p = Path('out/chatterbox-v3-narration.wav')
          with wave.open(str(p), 'rb') as wav:
              seconds = wav.getnframes() / wav.getframerate()
              assert seconds > 1, 'Audio too short'
              assert wav.getnchannels() in (1, 2), 'Bad channel count'
              assert wav.getframerate() >= 16000, 'Low sample rate'
          manifest = json.loads(p.with_suffix('.json').read_text())
          assert manifest['chunks']
          print('Narration length:', round(seconds, 2), 'seconds')
          print('Synthesis completed. Listening review still required.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chatterbox-v3-narration
          path: |
            out/chatterbox-v3-narration.wav
            out/chatterbox-v3-narration.json
          if-no-files-found: error
          retention-days: 7
