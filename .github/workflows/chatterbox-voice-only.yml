name: Generate Chatterbox Motion30 Voice Only
on:
  push:
    branches: [feat/chatterbox-motion30-showcase]
    paths:
      - '.github/workflows/chatterbox-voice-only.yml'
      - 'scripts/generate-motion30-voice.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chatterbox CPU with Nano from pinned upstream source
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchaudio==2.6.0
          python -m pip install -r requirements-chatterbox.txt
          python -m pip install --no-deps --force-reinstall git+https://github.com/resemble-ai/chatterbox.git@5de7a54aa4e5e2baadb0182dde554908b48b85c2
          command -v ffmpeg
      - name: Synthesize full 30-second English voice
        env:
          HF_HUB_DISABLE_XET: '1'
          OMP_NUM_THREADS: '4'
        run: |
          python scripts/generate-motion30-voice.py
          ffprobe -v error -show_entries format=duration -of default=nw=1 public/voiceovers/motion30.wav
      - uses: actions/upload-artifact@v4
        with:
          name: chatterbox-motion30-voice-only
          path: public/voiceovers/motion30.wav
          retention-days: 30
          if-no-files-found: error
