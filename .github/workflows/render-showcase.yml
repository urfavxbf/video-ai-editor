name: Render Video AI Editor Showcase

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/showcase/**'
      - 'src/Root.tsx'
      - '.github/workflows/render-showcase.yml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'src/showcase/**'
      - 'src/Root.tsx'
      - '.github/workflows/render-showcase.yml'

permissions:
  contents: read

jobs:
  render-showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate TypeScript
        run: npm run typecheck
      - name: Install Remotion renderer
        run: npx remotion browser ensure
      - name: Render genuine Remotion composition (half-res preview)
        run: >
          npx remotion render RepoShowcase out/repo-showcase-preview.mp4
          --codec=h264 --crf=21 --pixel-format=yuv420p
          --scale=0.5 --concurrency=2
      - name: Install FFmpeg verification tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Check encoded video and duration
        run: |
          test -s out/repo-showcase-preview.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=nw=1 out/repo-showcase-preview.mp4
          ffprobe -v error -show_entries format=duration -of default=nw=1 out/repo-showcase-preview.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: video-ai-editor-remotion-showcase-preview
          path: out/repo-showcase-preview.mp4
          retention-days: 14
