name: Render Becky G Editorial Preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/podcast/EditorialKinetic.tsx'
      - 'src/podcast/BeckyGEditorial.ts'
      - 'src/Root.tsx'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/render-becky-g.yml'

permissions:
  contents: read

jobs:
  render-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Ensure Chromium
        run: npx remotion browser ensure
      - name: Render royalty-free visual storyboard
        run: npm run render:becky-g
      - name: Verify MP4
        run: |
          test -s out/becky-g-editorial-preview.mp4
          ffprobe -v error -show_entries stream=width,height,r_frame_rate -of default=noprint_wrappers=1 out/becky-g-editorial-preview.mp4
      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: becky-g-editorial-silent-preview
          path: out/becky-g-editorial-preview.mp4
          retention-days: 14
          if-no-files-found: error
