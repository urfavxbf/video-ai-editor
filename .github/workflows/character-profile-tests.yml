name: Official UrFavXBF and PIX character profiles

on:
  pull_request:
    paths:
      - "characters/**"
      - "scripts/character_voiceover.py"
      - "scripts/pix_voice_profile.py"
      - "scripts/chatterbox_voice_profile.py"
      - "tests/test_character_*.py"
      - ".github/workflows/character-profile-tests.yml"
  push:
    branches: [main]
    paths:
      - "characters/**"
      - "scripts/character_voiceover.py"
      - "scripts/pix_voice_profile.py"
      - "tests/test_character_*.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  character-profiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Python syntax and saved identity profiles
        run: |
          python -m compileall -q scripts/character_voiceover.py scripts/pix_voice_profile.py scripts/chatterbox_voice_profile.py
          python -m unittest discover -s tests -p 'test_character_*.py' -v
          python -m unittest discover -s tests -p 'test_pix_voice_profile.py' -v
