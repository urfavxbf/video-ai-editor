name: Chatterbox V3 real audio smoke (CPU)

on:
  workflow_dispatch:
  push:
    branches:
      - fix/chatterbox-v3-source-20261028
    paths:
      - .github/workflows/chatterbox-v3-audio-smoke.yml

permissions:
  contents: read

concurrency:
  group: chatterbox-v3-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HF_HOME: ${{ runner.temp }}/huggingface
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-chatterbox.txt
      - name: Check free disk space
        run: |
          df -h .
          free -h
      - name: Install pinned CPU PyTorch before Chatterbox
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.6.0 torchaudio==2.6.0
      - name: Install pinned upstream V3 dependencies
        run: |
          python -m pip install -r requirements-chatterbox.txt
          python scripts/check_chatterbox_v3.py
      - name: Generate real English speech, not mocked audio
        run: |
          mkdir -p out
          python scripts/chatterbox_voiceover.py \
            --text 'Tonight, the Moon vanished. What happens next to the oceans on Earth?' \
            --language-id en \
            --device cpu \
            --output out/chatterbox-v3-real-smoke.wav
      - name: Check output has speech-like length and audible signal
        run: |
          python - <<'PY'
          import math
          import wave
          from pathlib import Path
          p = Path("out/chatterbox-v3-real-smoke.wav")
          assert p.is_file() and p.stat().st_size > 20000, "No recorded speech WAV"
          with wave.open(str(p), "rb") as wav:
              channels = wav.getnchannels()
              sr = wav.getframerate()
              length = wav.getnframes()/sr
              assert channels in (1, 2)
              assert sr >= 16000
              assert 1.0 < length < 40.0, f"unexpected duration {length}"
              data = wav.readframes(min(wav.getnframes(), sr*5))
              assert any(data), "silent audio bytes"
          print(f"WAV verified: {channels} channel(s), {sr} Hz, {length:.2f}s")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chatterbox-v3-english-voice-sample
          path: out/chatterbox-v3-real-smoke.wav
          if-no-files-found: error
          retention-days: 7
