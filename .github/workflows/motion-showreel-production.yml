name: Motion showreel — all 21 real FX and 3 animation engines

on:
  push:
    branches:
      - feat/real-21fx-motion-showreel-20261031
    paths:
      - .github/workflows/motion-showreel-production.yml
      - src/showcase/MotionShowreel.tsx
      - src/Root.tsx
      - scripts/generate_motion_reel_source.py
      - scripts/generate_motion_reel_score.py
      - tests/motion-showreel.test.cjs
      - docs/REAL_MOTION_SHOWREEL.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-real-motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      DO_NOT_TRACK: "1"
      HYPERFRAMES_NO_TELEMETRY: "1"
      HEYGEN_API_KEY: ""
      HYPERFRAMES_API_KEY: ""
      HEYGEN_ACCESS_TOKEN: ""
      GEMINI_API_KEY: ""
      OPENROUTER_API_KEY: ""
      ELEVENLABS_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned editors, source sprite generator and media tools
        run: |
          npm ci --no-audit --no-fund
          python3 -m pip install -r requirements.txt
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          npx remotion browser ensure
      - name: Validate all approved characters and 21 registered effects
        run: |
          python3 scripts/stage_pixel_default_pack.py --verify-workspace
          npm run typecheck
          node --test tests/motion-showreel.test.cjs
      - name: Generate actual animated character footage, 300 mattes and 300 stickers
        run: |
          python3 scripts/generate_motion_reel_source.py --output public/sample
          test -s public/sample/take.mp4
          test -s public/sample/fg/0000.webp
          test -s public/sample/fg/0299.webp
          test -s public/sample/sticker/0000.webp
          test -s public/sample/sticker/0299.webp
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,nb_frames -of default=nw=1 public/sample/take.mp4
      - name: Render independent HTML/GSAP HyperFrames animation offline
        run: |
          npm run hyperframes:render
          test -s public/hyperframes/kinetic-intro.mp4
      - name: Render real 21-effect + 3-engine MotionShowreel
        run: |
          mkdir -p out/motion-showreel
          npx remotion still MotionShowreel out/motion-showreel/opening.png --frame=38 --scale=0.5
          npx remotion still MotionShowreel out/motion-showreel/effect-active.png --frame=185 --scale=0.5
          npx remotion render MotionShowreel out/motion-showreel/video-only.mp4 \
            --scale=0.5 --concurrency=2 \
            --codec=h264 --crf=18 --pixel-format=yuv420p
          test -s out/motion-showreel/video-only.mp4
      - name: Create original synthesized soundtrack and mux the finished video
        run: |
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 out/motion-showreel/video-only.mp4)"
          python3 scripts/generate_motion_reel_score.py --seconds "$duration" \
            --output out/motion-showreel/original-score.wav
          ffmpeg -y -hide_banner -loglevel error \
            -i out/motion-showreel/video-only.mp4 \
            -i out/motion-showreel/original-score.wav \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k \
            -shortest -movflags +faststart \
            out/motion-showreel/Real_21_FX_Motion_Showreel.mp4
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          media=Path('out/motion-showreel/Real_21_FX_Motion_Showreel.mp4')
          assert media.is_file() and media.stat().st_size>300000
          data=json.loads(subprocess.check_output([
            'ffprobe','-v','error','-show_entries',
            'stream=codec_type,codec_name,width,height,r_frame_rate,nb_frames:format=duration',
            '-of','json',str(media)],text=True))
          streams=data['streams']
          v=next(s for s in streams if s['codec_type']=='video')
          a=next(s for s in streams if s['codec_type']=='audio')
          assert (v['codec_name'],v['width'],v['height'],v['r_frame_rate'])==('h264',960,540,'30/1')
          assert a['codec_name']=='aac'
          assert int(v['nb_frames'])>1200
          assert float(data['format']['duration'])>40
          subprocess.run(['ffmpeg','-v','error','-xerror','-i',str(media),'-f','null','-'],check=True)
          print('PASS: REAL 21 Remotion FX plus 3 engines, audiovisual decode,',data['format']['duration'],'seconds')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-real-21-fx-motion-showreel
          path: |
            out/motion-showreel/Real_21_FX_Motion_Showreel.mp4
            out/motion-showreel/opening.png
            out/motion-showreel/effect-active.png
          retention-days: 14
          if-no-files-found: warn
