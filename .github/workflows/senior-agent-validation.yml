name: Senior Agent and Central Skill Validation

on:
  pull_request:
    paths:
      - '.github/agents/**'
      - '.agents/skills/**'
      - '.claude/skills/**'
      - 'docs/SENIOR_MULTIDISCIPLINARY_AGENT.md'
      - 'tests/test_skill_orchestrator.py'
      - 'tests/test_media_ingest.py'
      - 'scripts/media_ingest.py'
      - 'requirements-media-ingestion.txt'
      - '.github/workflows/senior-agent-validation.yml'
  push:
    branches: [main]
    paths:
      - '.github/agents/**'
      - '.agents/skills/**'
      - '.claude/skills/**'
      - 'docs/SENIOR_MULTIDISCIPLINARY_AGENT.md'
      - 'tests/test_skill_orchestrator.py'
      - 'tests/test_media_ingest.py'
      - 'scripts/media_ingest.py'
      - 'requirements-media-ingestion.txt'
      - '.github/workflows/senior-agent-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-media-ingestion.txt
      - name: Validate canonical senior skill
        run: python3 .agents/skills/senior-multidisciplinary-agent/scripts/validate_skill.py
      - name: Python syntax
        run: python3 -m py_compile .agents/skills/senior-multidisciplinary-agent/scripts/*.py
      - name: Validate all modular skill routes
        run: python3 -m unittest discover -s tests -p 'test_skill_orchestrator.py' -v
      - name: Verify pinned yt-dlp installation and model-free ingestion contract
        run: |
          python3 -m pip install -r requirements-media-ingestion.txt
          python3 -m yt_dlp --version
          python3 -m py_compile scripts/media_ingest.py tests/test_media_ingest.py
          python3 -m unittest discover -s tests -p 'test_media_ingest.py' -v
      - name: Validate custom Copilot agent profile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/agents/senior-multidisciplinary.agent.md').read_text()
          assert text.startswith('---\nname: Senior Multidisciplinary Engineer\n')
          assert '.agents/skills/senior-multidisciplinary-agent/SKILL.md' in text
          assert '.claude/skills/video-ai-orchestrator/SKILL.md' in text
          PY
