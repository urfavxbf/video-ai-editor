name: Showreel — 33 FX with UrFavXBF + PIX (Chatterbox V3, CPU)

on:
  workflow_dispatch:
  push:
    branches:
      - showreel/33fx-chatterbox
    paths:
      - .github/workflows/showreel-33fx.yml
      - showreel/script.json
      - scripts/showreel_voices.py
      - scripts/showreel_render_fx.mjs
      - scripts/showreel_compose.py

permissions:
  contents: write

concurrency:
  group: showreel-33fx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  showreel:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      DO_NOT_TRACK: '1'
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONUNBUFFERED: '1'
      NODE_OPTIONS: --max-old-space-size=4096
      LOG: showreel/output/build-log.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-chatterbox.txt
      - name: Install pinned toolchain (CPU only)
        run: |
          set -o pipefail
          mkdir -p showreel/output
          echo "run ${{ github.run_id }} on ${{ github.sha }}" > "$LOG"
          (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core) 2>&1 | tail -3 | tee -a "$LOG"
          npm ci --no-audit --no-fund 2>&1 | tail -5 | tee -a "$LOG"
          python -m pip install --upgrade pip 2>&1 | tail -1
          python -m pip install -r requirements.txt numpy pillow 2>&1 | tail -2 | tee -a "$LOG"
          npx remotion browser ensure 2>&1 | tail -2 | tee -a "$LOG"
      - name: Verify approved UrFavXBF / PIX artwork
        run: |
          set -o pipefail
          python3 scripts/stage_pixel_default_pack.py --verify-workspace 2>&1 | tail -5 | tee -a "$LOG"
      - name: Generate character source take, mattes and reactive audio
        run: |
          set -o pipefail
          python3 scripts/generate_advanced_showcase_source.py --output public/sample 2>&1 | tee -a "$LOG"
          python3 scripts/generate_advanced_fx_audio.py 2>&1 | tee -a "$LOG"
          test -s public/sample/take.mp4 && test -s public/sample/fg/0299.webp && test -s public/sample/sticker/0299.webp
      - name: Install Chatterbox Multilingual V3 (CPU)
        run: |
          set -o pipefail
          python scripts/prepare_pix_reference.py 2>&1 | tee -a "$LOG"
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchaudio==2.6.0 2>&1 | tail -2 | tee -a "$LOG"
          python -m pip install -r requirements-chatterbox.txt 2>&1 | tail -2 | tee -a "$LOG"
          python scripts/check_chatterbox_v3.py 2>&1 | tee -a "$LOG"
      - name: Synthesize all dialogue (UrFavXBF Natural Storyteller + PIX Emily)
        run: |
          set -o pipefail
          python scripts/showreel_voices.py --script showreel/script.json --out out/showreel/voice --device cpu 2>&1 | sed -u '/it\/s/d' | tee -a "$LOG"
      - name: Render all 33 effects through the real FxPreview composition
        run: |
          set -o pipefail
          node scripts/showreel_render_fx.mjs showreel/script.json out/showreel/voice/voices.json out/showreel/fx 2>&1 | tee -a "$LOG"
      - name: Compose 1920x1080 showreel
        run: |
          set -o pipefail
          python3 scripts/showreel_compose.py --out out/showreel/final/Video_AI_Editor_Showreel.mp4 2>&1 | tee -a "$LOG"
      - name: Machine QA
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee -a "$LOG"
          import json, subprocess
          from pathlib import Path
          v = Path('out/showreel/final/Video_AI_Editor_Showreel.mp4')
          d = json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries',
              'format=duration,size:stream=codec_type,codec_name,width,height,r_frame_rate','-of','json',str(v)],text=True))
          vs = next(s for s in d['streams'] if s['codec_type']=='video'); au = next(s for s in d['streams'] if s['codec_type']=='audio')
          assert (vs['codec_name'],vs['width'],vs['height'],vs['r_frame_rate'])==('h264',1920,1080,'30/1'), vs
          assert au['codec_name']=='aac', au
          assert int(d['format']['size']) < 95_000_000, 'too large to commit'
          subprocess.run(['ffmpeg','-v','error','-xerror','-i',str(v),'-f','null','-'],check=True)
          print('QA PASS', d['format'])
          PY
          cp out/showreel/final/Video_AI_Editor_Showreel.mp4 out/showreel/final/contact-sheet.jpg out/showreel/final/timeline.json showreel/output/
          python3 -c "import json;d=json.load(open('out/showreel/voice/voices.json'));[l.pop('rms') for l in d['lines']];json.dump(d,open('showreel/output/voices.json','w'),indent=1)"
          cp out/showreel/fx/manifest.json showreel/output/fx-manifest.json
      - name: Publish result (or failure log) to this branch
        if: always()
        run: |
          echo '{"run":"${{ github.run_id }}","status":"${{ job.status }}","sha":"${{ github.sha }}"}' > showreel/output/status.json
          git config user.name "showreel-bot"
          git config user.email "showreel-bot@users.noreply.github.com"
          git add -f showreel/output
          git commit -m "Showreel build ${{ github.run_id }}: ${{ job.status }}" || exit 0
          git push origin HEAD:${{ github.ref_name }}
